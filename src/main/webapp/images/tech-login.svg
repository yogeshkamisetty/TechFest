<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFDF9" />
    </linearGradient>
    <linearGradient id="tealGradLogin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E9F90" />
      <stop offset="100%" stop-color="#0B7A70" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB366" />
      <stop offset="100%" stop-color="#FF9933" />
    </linearGradient>
    <filter id="loginGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8A5A3C" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="15" y="15" width="420" height="330" rx="20" fill="url(#cardGrad)" stroke="#F0DCC0" stroke-width="2" />

  <!-- Circuit Trace Lines in Background -->
  <g stroke="#EAD8C3" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 40 80 H 120 L 150 110" />
    <circle cx="40" cy="80" r="3.5" fill="#0B7A70" />
    <path d="M 410 70 H 330 L 300 100" />
    <circle cx="410" cy="70" r="3.5" fill="#FF9933" />
    <path d="M 50 280 H 130 L 160 250" />
    <circle cx="50" cy="280" r="3.5" fill="#FFC83D" />
    <path d="M 400 290 H 320 L 290 260" />
    <circle cx="400" cy="290" r="3.5" fill="#0B7A70" />
  </g>

  <!-- Central Security Pass / Badge Visual -->
  <g filter="url(#loginGlow)" transform="translate(135, 60)">
    <!-- Main Badge Shield Frame -->
    <rect x="0" y="0" width="180" height="210" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" />
    <!-- Badge Lanyard Slot -->
    <rect x="65" y="10" width="50" height="6" rx="3" fill="#64748B" />

    <!-- Circular Lock / Biometric Icon -->
    <circle cx="90" cy="70" r="36" fill="url(#tealGradLogin)" />
    <!-- Lock Graphic inside Circle -->
    <rect x="76" y="65" width="28" height="22" rx="4" fill="#FFFFFF" />
    <path d="M 82 65 V 56 A 8 8 0 0 1 98 56 V 65" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="90" cy="74" r="3" fill="#0B7A70" />
    <path d="M 90 77 V 82" stroke="#0B7A70" stroke-width="2" stroke-linecap="round" />

    <!-- Identity Lines -->
    <rect x="35" y="125" width="110" height="8" rx="4" fill="#FF9933" />
    <rect x="45" y="142" width="90" height="6" rx="3" fill="#64748B" />
    <rect x="55" y="156" width="70" height="5" rx="2.5" fill="#475569" />

    <!-- Checkmark Badge -->
    <circle cx="90" cy="184" r="12" fill="#10B981" />
    <path d="M 84 184 L 88 188 L 96 180" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Floating Chip Left: SECURE LOGIN -->
  <g filter="url(#loginGlow)" transform="translate(30, 160)">
    <rect width="110" height="36" rx="8" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="1.2" />
    <text x="55" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#5B3A29" text-anchor="middle">Student Access</text>
  </g>

  <!-- Floating Chip Right: VERIFIED ARENA -->
  <g filter="url(#loginGlow)" transform="translate(310, 160)">
    <rect width="105" height="36" rx="8" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="1.2" />
    <text x="52" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B7A70" text-anchor="middle">Admin Portal</text>
  </g>

  <!-- Bottom Caption -->
  <text x="225" y="315" font-family="sans-serif" font-size="12" font-weight="600" fill="#8A5A3C" text-anchor="middle">Campus Technical Fest Hub Authentication</text>
</svg>
