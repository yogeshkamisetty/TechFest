<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E9F90" />
      <stop offset="100%" stop-color="#0B7A70" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB366" />
      <stop offset="100%" stop-color="#FF9933" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8A5A3C" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect x="20" y="20" width="560" height="410" rx="24" fill="#FFFDF9" stroke="#F0DCC0" stroke-width="2" />

  <!-- Circuit Trace Pattern in Background -->
  <g stroke="#E8D5BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 60 120 H 140 L 170 150 H 220" />
    <circle cx="60" cy="120" r="4" fill="#0B7A70" />
    <circle cx="220" cy="150" r="4" fill="#FF9933" />

    <path d="M 540 100 H 460 L 430 130 H 380" />
    <circle cx="540" cy="100" r="4" fill="#FF9933" />
    <circle cx="380" cy="130" r="4" fill="#0B7A70" />

    <path d="M 60 360 H 160 L 190 330 H 220" />
    <circle cx="60" cy="360" r="4" fill="#FFC83D" />

    <path d="M 540 340 H 440 L 410 370 H 370" />
    <circle cx="540" cy="340" r="4" fill="#0B7A70" />
  </g>

  <!-- Floating Badge Top Left: CODING / ALGORITHMS -->
  <g filter="url(#softGlow)" transform="translate(60, 60)">
    <rect width="160" height="52" rx="12" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="1.5" />
    <circle cx="30" cy="26" r="14" fill="#E6F5F3" />
    <text x="30" y="31" font-family="monospace" font-size="14" font-weight="bold" fill="#0B7A70" text-anchor="middle">&lt;/&gt;</text>
    <text x="56" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#5B3A29">Code Storm</text>
    <text x="56" y="38" font-family="sans-serif" font-size="10" fill="#8A5A3C">Algorithms &amp; Logic</text>
  </g>

  <!-- Floating Badge Top Right: ROBOTICS & AI -->
  <g filter="url(#softGlow)" transform="translate(380, 50)">
    <rect width="160" height="52" rx="12" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="1.5" />
    <circle cx="30" cy="26" r="14" fill="#FFF3E6" />
    <!-- Microchip Icon -->
    <rect x="23" y="19" width="14" height="14" rx="2" fill="#FF9933" />
    <path d="M 20 23 H 23 M 20 28 H 23 M 37 23 H 40 M 37 28 H 40 M 27 16 V 19 M 33 16 V 19 M 27 33 V 36 M 33 33 V 36" stroke="#FF9933" stroke-width="1.5" stroke-linecap="round" />
    <text x="56" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#5B3A29">Robo Rumble</text>
    <text x="56" y="38" font-family="sans-serif" font-size="10" fill="#8A5A3C">AI &amp; Robotics Arena</text>
  </g>

  <!-- Central Laptop Mockup -->
  <g filter="url(#softGlow)" transform="translate(130, 140)">
    <!-- Screen Bezel -->
    <rect x="20" y="0" width="300" height="190" rx="12" fill="url(#laptopGrad)" stroke="#4A5568" stroke-width="2" />
    <!-- Web Camera Dot -->
    <circle cx="170" cy="8" r="2.5" fill="#718096" />

    <!-- Screen Display -->
    <rect x="30" y="16" width="280" height="164" rx="4" fill="url(#screenGrad)" />

    <!-- Editor Header Tab Bar -->
    <rect x="30" y="16" width="280" height="22" fill="#1A202C" />
    <!-- Window Control Dots -->
    <circle cx="44" cy="27" r="4" fill="#EF4444" />
    <circle cx="56" cy="27" r="4" fill="#F59E0B" />
    <circle cx="68" cy="27" r="4" fill="#10B981" />
    <!-- Tab -->
    <rect x="85" y="19" width="90" height="19" rx="3" fill="#2D3748" />
    <text x="130" y="32" font-family="monospace" font-size="9" fill="#E2E8F0" text-anchor="middle">TechFest2026.java</text>

    <!-- Code Lines / Visualizer -->
    <g font-family="monospace" font-size="10" fill="#E2E8F0">
      <!-- Line Numbers -->
      <text x="42" y="55" fill="#475569">01</text>
      <text x="42" y="72" fill="#475569">02</text>
      <text x="42" y="89" fill="#475569">03</text>
      <text x="42" y="106" fill="#475569">04</text>
      <text x="42" y="123" fill="#475569">05</text>
      <text x="42" y="140" fill="#475569">06</text>
      <text x="42" y="157" fill="#475569">07</text>

      <!-- Code Syntax Bars -->
      <text x="64" y="55"><tspan fill="#FF9933">public class</tspan> <tspan fill="#67E8F9">TechFest2026</tspan> {</text>
      <text x="76" y="72"><tspan fill="#0E9F90">@CampusEvent</tspan>(status = <tspan fill="#34D399">"LIVE"</tspan>)</text>
      <text x="76" y="89"><tspan fill="#FF9933">void</tspan> <tspan fill="#FDE047">registerStudent</tspan>(Pass pass) {</text>
      <text x="88" y="106">arena.enroll(pass.asDigital());</text>
      <text x="88" y="123"><tspan fill="#94A3B8">// 9 Competitions &amp; Prizes</tspan></text>
      <text x="88" y="140">system.out.confirm(<tspan fill="#34D399">"SUCCESS"</tspan>);</text>
      <text x="76" y="157">}</text>
    </g>

    <!-- Laptop Base / Keyboard Deck -->
    <path d="M 0 190 L 340 190 L 325 210 L 15 210 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Trackpad Notch -->
    <rect x="135" y="192" width="70" height="5" rx="2" fill="#94A3B8" />
  </g>

  <!-- Bottom Badge: PRIZES & CERTIFICATES -->
  <g filter="url(#softGlow)" transform="translate(180, 360)">
    <rect width="240" height="42" rx="10" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="1.5" />
    <circle cx="24" cy="21" r="11" fill="#FEF3C7" />
    <!-- Trophy Star -->
    <path d="M 24 14 L 26 19 L 31 19 L 27 22 L 29 27 L 24 24 L 19 27 L 21 22 L 17 19 L 22 19 Z" fill="#D97706" />
    <text x="46" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#5B3A29">Campus Technical Fest 2026</text>
  </g>
</svg>
