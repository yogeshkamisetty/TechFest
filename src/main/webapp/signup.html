<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Tech Fest Hub</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body class="login-frame signup-frame" data-layer="05-signup">
  <div class="auth-split signup-split" data-layer="auth-split">
    <!-- Form Section -->
    <section class="auth-form-side signup-form-side">
      <a class="auth-logo" href="index.html" aria-label="Tech Fest Hub home">
        <span class="tech-badge-icon">&lt;/&gt;</span>TECH FEST HUB
      </a>
      <div class="form-container signup-card" data-layer="form-container">
        <span class="login-eyebrow">JOIN THE ARENA</span>
        <h1 class="login-title" style="font-size: 26px; font-weight: 800; margin: 4px 0 8px; color: #5B3A29;">Create your student account</h1>
        <p class="login-sub">Takes less than a minute to get ready for campus registrations.</p>

        <!-- Alert Slot for error/success message -->
        <div class="signup-alert-slot" data-layer="alert-slot" id="signup-alert-slot"></div>

        <form id="signup-form" action="signup" method="POST">
          <div class="form-group signup-field" id="name-group">
            <label for="signup-name">FULL NAME</label>
            <div class="form-input">
              <span class="input-left-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              </span>
              <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Aarav Sharma" required />
            </div>
          </div>

          <div class="form-group signup-field" id="email-group">
            <label for="signup-email">COLLEGE EMAIL</label>
            <div class="form-input">
              <span class="input-left-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
              </span>
              <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@college.edu" required />
            </div>
          </div>

          <div class="form-group signup-field" id="password-group">
            <label for="signup-password">PASSWORD</label>
            <div class="form-input">
              <span class="input-left-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              </span>
              <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required />
              <button type="button" class="input-eye" id="toggle-signup-pwd" aria-label="Toggle password visibility">
                <svg id="eye-icon-pwd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-group signup-field" id="dept-group">
            <label for="signup-department">DEPARTMENT</label>
            <div class="form-input">
              <span class="input-left-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
              </span>
              <input id="signup-department" name="department" type="text" placeholder="Computer Science" required />
            </div>
          </div>

          <button id="signup-submit-btn" type="submit" class="btn btn-primary btn-size-l is-default" style="width: 100%; margin-top: 20px;">
            <span>Create Student Account &rarr;</span>
          </button>
        </form>

        <div class="login-create signup-login" style="margin-top: 24px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center;">
          <span>Already have an account? <a href="login.html" id="login-link" style="color: #0B7A70; font-weight: 600;">Log in</a></span>
          <a href="index.html" style="color: #8A5A3C; font-size: 13px; text-decoration: none;">&larr; Back to Home</a>
        </div>
      </div>
    </section>

    <!-- Right Scene -->
    <section class="auth-scene">
      <!-- Clean Technical Illustration -->
      <div style="text-align: center; margin: 32px auto; max-width: 440px;">
        <img src="images/tech-signup.svg" alt="Tech Fest Student Enrollment" style="width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 10px 24px rgba(138, 90, 60, 0.08));" />
      </div>

      <div class="auth-quote-block">
        <div class="auth-quote">Join over 1,000 students competing across 7 technical arenas.</div>
        <div class="auth-chips">
          <span>INSTANT PASSES</span>
          <span>TEAM &amp; SOLO</span>
          <span>CAMPUS CERTIFICATE</span>
        </div>
      </div>
    </section>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
