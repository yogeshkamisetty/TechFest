<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Tech Fest Hub</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-frame events-frame" data-layer="02-events">
  <div class="page-wash" aria-hidden="true"></div>

  <!-- Navbar Mount -->
  <div id="navbar-mount"></div>

  <main>
    <!-- Events Header -->
    <section class="events-header" data-layer="page-header">
      <div class="home-jaali"></div>
      <div class="home-container">
        <div class="breadcrumb">HOME / EVENTS</div>
        <div class="events-title" role="heading" aria-level={1}>Find your next <em>challenge</em></div>
        <p>Browse technical events across campus, filter by category and register in a few clicks.</p>
      </div>
      <div class="header-magnifier" data-layer="3d-header-shape">
        <i></i><b></b><span></span>
      </div>
    </section>

    <!-- Filter Bar -->
    <div class="events-filter home-container" data-layer="filter-bar">
      <div class="filter-row">
        <label class="search-ds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
          </svg>
          <input type="search" id="search-input" placeholder="Search events by name…" aria-label="Search events by name">
        </label>

        <label class="events-select">
          <span>Sort by:</span>
          <select id="sort-select">
            <option value="date">Date (soonest)</option>
            <option value="fee">Fee: low to high</option>
            <option value="name">Name A–Z</option>
          </select>
        </label>

        <button type="button" class="toggle-ds" id="open-only-toggle" role="switch" aria-checked="false">
          <i></i>Open only
        </button>

        <span class="filter-count" id="filter-count" aria-live="polite">08 EVENTS</span>
      </div>

      <div class="chip-row" id="category-chips-row">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Event Grid -->
    <section class="events-grid home-container" id="events-grid-mount" data-layer="event-grid">
      <!-- Rendered via JS -->
    </section>
  </main>

  <!-- Footer Mount -->
  <div class="home-footer" id="footer-mount"></div>

  <!-- Page Logic -->
  <script type="module" src="js/events.js"></script>
</body>
</html>
